<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publications | Climate Dynamics Lab</title>
    <link rel="stylesheet" href="main.css" />
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="loader">
      <img src="images/icon.svg" alt="Climate Dynamics Lab Loader Icon" />
    </div>

    <div class="wrapper">
      <lab-navbar></lab-navbar>

      <div class="hero-container">
        <div class="slideshow">
          <div class="slide active">
            <img src="images/pubs.png" alt="Scientific manuscripts and climate calculation arrays" />
          </div>
        </div>
        <div class="banner-text">
          <p>Scientific Output</p>
          <h1>Publications</h1>
          <h2>Peer-Reviewed Journal Contributions and Discoveries</h2>
        </div>
      </div>

      <main id="main-content">
        <section class="container">
          <div class="pub-section">
            
            <div class="pub-header">
              <h2>Journal Articles</h2>
              <div class="search-container">
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Search by author, year, title, or journal..."
                  aria-label="Filter laboratory publications"
                />
                <button type="button" class="icon-btn search-icon-btn" disabled aria-hidden="true">
                  <span class="iconify" data-icon="mdi:magnify"></span>
                </button>
                <button type="button" class="icon-btn clear-btn" onclick="clearSearch()" aria-label="Clear filter parameters">
                  <span class="iconify" data-icon="mdi:close-circle-outline"></span>
                </button>
              </div>
            </div>

            <ol class="pub-list" id="publicationsContainer">
              </ol>

          </div>
        </section>
      </main>

      <lab-footer></lab-footer>
    </div>
  </body>
</html>
